name: awesome_custom_dialog
description: "A chainable toolkit for Flutter: dialogs, toasts, snackbars, form fields, switches, progress indicators, PIN/OTP fields, motion, and decorations. No third-party dependencies beyond Flutter's material_ui."
version: 2.0.0
homepage: https://github.com/devamitkumartiwari/awesome_custom_dialog
repository: https://github.com/devamitkumartiwari/awesome_custom_dialog
issue_tracker: https://github.com/devamitkumartiwari/awesome_custom_dialog/issues
topics:
  - dialog
  - widgets
  - forms
  - animation
  - authentication


environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

