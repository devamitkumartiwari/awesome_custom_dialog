name: awesome_custom_dialog_example
description: "Demonstrates how to use the awesome_custom_dialog plugin."

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  awesome_custom_dialog:
    path: ../

  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  assets:
    - images/

